name: Java CI with Maven

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Record tool versions
        run: mvn -version
      - name: Verify code and packaged artifacts
        run: mvn -B clean verify
      - name: Identify artifacts
        id: artifacts
        run: bash .github/scripts/artifact-metadata.sh
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ashgrid-${{ github.sha }}-jdk${{ matrix.java }}
          if-no-files-found: error
          path: |
            target/${{ steps.artifacts.outputs.finalName }}.jar
            target/${{ steps.artifacts.outputs.finalName }}-sources.jar
            target/${{ steps.artifacts.outputs.finalName }}-javadoc.jar
            target/surefire-reports/
            target/failsafe-reports/
